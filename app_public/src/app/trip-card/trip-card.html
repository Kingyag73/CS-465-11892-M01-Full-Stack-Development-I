<div class="card h-100 shadow-sm">
  <div class="card-body">
    <h3 class="card-title">{{ trip.name }}</h3>

    <p class="card-text">
      <strong>Trip Code:</strong> {{ trip.code }}
    </p>

    <p class="card-text">
      <strong>Length:</strong> {{ trip.length }}
    </p>

    <p class="card-text">
      <strong>Start Date:</strong> {{ trip.start }}
    </p>

    <p class="card-text">
      <strong>Resort:</strong> {{ trip.resort }}
    </p>

    <p class="card-text">
      <strong>Price:</strong> {{ trip.price }}
    </p>
  </div>
</div>
